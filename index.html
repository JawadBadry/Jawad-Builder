<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق AI Chat - Groq API</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --user-msg: #0284c7;
            --ai-msg: #334155;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .api-container {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-container input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            outline: none;
        }

        .chat-box {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-start;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-end;
            background-color: var(--ai-msg);
            color: white;
            border-bottom-left-radius: 2px;
        }

        .message.error {
            align-self: center;
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .input-container textarea {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: var(--card-bg);
            color: #fff;
            resize: none;
            height: 50px;
            outline: none;
        }

        .input-container button {
            padding: 0 25px;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-container button:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .input-container button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h1>شات الذكاء الاصطناعي (Groq API)</h1>
        <p>يعمل بنموذج <code>llama-3.1-8b-instant</code> الحديث</p>
    </header>

    <div class="api-container">
        <label for="apiKey">مفتاح API:</label>
        <input type="password" id="apiKey" placeholder="أدخل مفتاح Groq الخاص بك هنا (gsk_...)" />
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai">مرحباً! أنا جاهز للمساعدة، اكتب سؤالك في الأسفل.</div>
    </div>

    <div class="input-container">
        <textarea id="userInput" placeholder="اكتب رسالتك هنا... (اضغط Enter للإرسال)" onkeydown="checkEnter(event)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        async function sendMessage() {
            const apiKeyInput = document.getElementById("apiKey");
            const userInput = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const sendBtn = document.getElementById("sendBtn");

            const apiKey = apiKeyInput.value.trim();
            const prompt = userInput.value.trim();

            if (!apiKey) {
                alert("يرجى إدخال مفتاح Groq API في الحقل المخصص أعلاه!");
                return;
            }

            if (!prompt) return;

            // إضافة رسالة المستخدم للواجهة
            appendMessage(prompt, "user");
            userInput.value = "";
            userInput.style.height = "50px";

            // إظهار مؤشر التحميل
            const loadingDiv = appendMessage("جاري التفكير...", "ai");
            sendBtn.disabled = true;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", // ✅ النموذج الحديث المعتمد
                        messages: [
                            { role: "system", content: "أنت مساعد ذكي ومفيد تتحدث باللغة العربية بوضوح ودقة." },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    loadingDiv.textContent = data.choices[0].message.content;
                } else {
                    loadingDiv.className = "message error";
                    loadingDiv.textContent = "خطأ: " + (data.error?.message || "تعذر معالجة الطلب");
                }
            } catch (error) {
                loadingDiv.className = "message error";
                loadingDiv.textContent = "فشل الاتصال: " + error.message;
            } finally {
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function appendMessage(text, type) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function checkEnter(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
