<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jawad AI 🤖</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-panel: #131a2a;
      --bg-input: #1d263b;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --shadow-glow: 0 4px 20px rgba(99, 102, 241, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    .secret-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      outline: none;
      font-size: 13px;
      -webkit-text-security: disc;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 5px;
      scroll-behavior: smooth;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      max-width: 85%;
      word-break: break-word;
      line-height: 1.5;
    }

    .user-msg {
      background: var(--accent-grad);
      color: #fff;
      align-self: flex-start;
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-glow);
    }

    .ai-msg {
      background: var(--bg-input);
      color: var(--text-main);
      align-self: flex-end;
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    .prompt-input {
      flex: 1;
      padding: 11px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 12px;
      outline: none;
      font-size: 13px;
    }

    .btn-send {
      background: var(--accent-grad);
      color: #fff;
      border: none;
      padding: 0 18px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: var(--shadow-glow);
    }

    .btn-send:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <div class="logo">🤖 Jawad AI</div>
    </header>

    <main>
      <input type="password" id="secretKey" class="secret-input" placeholder="أدخل API Key الخطي بموقع Groq..." autocomplete="off">

      <div class="chat-box" id="chatBox">
        <div class="msg ai-msg">مرحباً جواد! كيف يمكنني مساعدتك اليوم؟</div>
      </div>

      <div class="input-area">
        <input type="text" id="userInput" class="prompt-input" placeholder="اكتب رسالتك هنا...">
        <button class="btn-send" id="sendBtn">إرسال</button>
      </div>
    </main>
  </div>

  <script>
    // دالة فحص وجلب الموديل الشغال تلقائياً من Groq
    async function getActiveModel(apiKey) {
      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${apiKey}` }
        });
        const data = await res.json();
        if (data.data && data.data.length > 0) {
          const availableModels = data.data.map(m => m.id);
          const preferredList = [
            "llama-3.1-8b-instant",
            "llama3-70b-8192",
            "llama3-8b-8192",
            "mixtral-8x7b-32768",
            "gemma2-9b-it"
          ];

          for (let pref of preferredList) {
            if (availableModels.includes(pref)) return pref;
          }
          return availableModels[0];
        }
      } catch (e) {
        console.error("Failed to fetch models list", e);
      }
      return "llama-3.1-8b-instant";
    }

    // دالة إرسال الرسالة إلى الـ AI
    async function sendMessage() {
      const apiKey = document.getElementById('secretKey').value.trim();
      const input = document.getElementById('userInput');
      const prompt = input.value.trim();

      if (!prompt) return;
      if (!apiKey) {
        alert('يرجى إدخال API Key أولاً!');
        return;
      }

      addMessage(prompt, 'user-msg');
      input.value = '';
      
      const loadingMsg = addMessage('جاري التفكير...', 'ai-msg');

      try {
        const activeModel = await getActiveModel(apiKey);
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: activeModel,
            messages: [
              { role: "system", content: "أنت مساعد ذكي ولطيف اسمه Jawad AI." },
              { role: "user", content: prompt }
            ]
          })
        });

        const data = await response.json();

        if (response.ok && data.choices && data.choices[0]?.message?.content) {
          loadingMsg.innerText = data.choices[0].message.content;
        } else {
          const errDetail = data.error ? data.error.message : 'تأكد من صحة المفتاح.';
          loadingMsg.innerText = 'خطأ: ' + errDetail;
        }
      } catch (err) {
        loadingMsg.innerText = 'حدث خطأ في الاتصال بالشبكة.';
      }
    }

    function addMessage(text, className) {
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = 'msg ' + className;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
      return msg;
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('userInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
