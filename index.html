<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع المواقع بالذكاء الاصطناعي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* الهيدر وشريط API Key */
        header {
            background-color: #1e293b;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            font-size: 1.2rem;
            color: #38bdf8;
        }

        .api-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .api-input-group input {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            outline: none;
            width: 250px;
        }

        /* حاوية محرر الأكواد والـ Preview */
        .main-container {
            flex: 1;
            display: flex;
            height: calc(100vh - 140px);
        }

        /* لوحة التحكم والإدخال (اليسار/اليمين حسب الاتجاه) */
        .sidebar {
            width: 320px;
            background-color: #1e293b;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-left: 1px solid #334155;
        }

        .sidebar textarea {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            resize: none;
            outline: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .sidebar button {
            padding: 12px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .sidebar button:hover {
            background-color: #0284c7;
            color: #fff;
        }

        .sidebar button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        /* منطقة المعاينة (Iframe) */
        .preview-area {
            flex: 1;
            background-color: #ffffff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            color: #38bdf8;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>مولّد المواقع بالذكاء الاصطناعي (Groq AI)</h1>
        <div class="api-input-group">
            <label for="apiKey">مفتاح API:</label>
            <input type="password" id="apiKey" placeholder="gsk_..." />
        </div>
    </header>

    <div class="main-container">
        <!-- لوحة طلب الموقع -->
        <div class="sidebar">
            <label for="prompt">صف الموقع الذي تريد إنشاءه:</label>
            <textarea id="prompt" placeholder="مثال: سوي لي موقع حاسبة بسيطة ألوانها متناسقة وتصميمها عصري..."></textarea>
            <button id="generateBtn" onclick="generateWebsite()">توليد الموقع ✨</button>
        </div>

        <!-- منطقة معاينة الموقع الناتجة -->
        <div class="preview-area">
            <div class="loading-overlay" id="loading">جاري توليد كود الموقع... 🚀</div>
            <iframe id="previewFrame"></iframe>
        </div>
    </div>

    <script>
        async function generateWebsite() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const promptText = document.getElementById("prompt").value.trim();
            const loading = document.getElementById("loading");
            const btn = document.getElementById("generateBtn");
            const iframe = document.getElementById("previewFrame");

            if (!apiKey) {
                alert("يرجى إدخال مفتاح Groq API في أعلى الصفحة أولاً!");
                return;
            }

            if (!promptText) {
                alert("اكتب وصفاً للموقع الذي تريد إنشاءه!");
                return;
            }

            loading.style.display = "flex";
            btn.disabled = true;

            // الـ System Prompt لضمان إخراج كود HTML/CSS/JS صافي جاهز للعرض
            const systemPrompt = `أنت خبير في تطوير المواقع (HTML, CSS, JavaScript). 
قم بإنشاء كود HTML كامل وجاهز للعمل مباشرة داخل ملف واحد يحتوي على التنسيقات (CSS) والأكواد (JS).
ملاحظة مهمة جداً: أرجع فقط الكود الصافي دون أي شرح أو مقدمات أو تعليمات Markdown مثل \`\`\`html. ابدأ مباشرة بـ <!DOCTYPE html>.`;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", // ✅ النموذج الشغال حالياً
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: promptText }
                        ],
                        temperature: 0.7,
                        max_tokens: 4096
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    let generatedCode = data.choices[0].message.content.trim();
                    
                    // تنظيف الكود في حال أضاف النموذج علامات markdown
                    generatedCode = generatedCode.replace(/^```html/i, '').replace(/^```/i, '').replace(/```$/i, '').trim();

                    // عرض الكود داخل الـ iframe مباشرة
                    iframe.srcdoc = generatedCode;
                } else {
                    alert("خطأ من Groq: " + (data.error?.message || "تعذر توليد الكود"));
                }
            } catch (error) {
                alert("فشل الاتصال: " + error.message);
            } finally {
                loading.style.display = "none";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
