<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jawad Builder 🚀</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-panel: #151c28;
      --bg-input: #1e2738;
      --border-color: #2a364f;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --workspace-bg: #070a0f;
    }

    /* الوضع الصباحي (Light Mode) */
    body.light-mode {
      --bg-main: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-input: #e2e8f0;
      --border-color: #cbd5e1;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --workspace-bg: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: background 0.2s, color 0.2s; }
    body { display: flex; flex-direction: column; height: 100vh; background: var(--bg-main); color: var(--text-main); overflow: hidden; }

    /* الهيدر العلوي */
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); }
    .logo { font-size: 1.2rem; font-weight: 700; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .btn-tool { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-tool:hover { border-color: var(--accent-color); }

    .btn-download { background: var(--accent-color); color: #fff; border: none; padding: 8px 16px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13px; }
    .btn-download:hover { background: var(--accent-hover); }

    /* الجسم الرئيسي */
    main { display: flex; flex: 1; height: calc(100vh - 57px); }

    /* لوحة المحادثة والذكاء الاصطناعي */
    .chat-panel { width: 340px; background: var(--bg-panel); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 14px; gap: 12px; }
    body.en-mode .chat-panel { border-left: none; border-right: 1px solid var(--border-color); }

    .secret-input { padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; outline: none; font-size: 13px; }
    .secret-input:focus { border-color: var(--accent-color); }

    .chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-left: 4px; }
    .msg { padding: 10px 14px; border-radius: 10px; font-size: 13px; max-width: 90%; word-break: break-word; line-height: 1.5; }
    .user-msg { background: var(--accent-color); color: #fff; align-self: flex-start; border-bottom-right-radius: 2px; }
    body.en-mode .user-msg { align-self: flex-end; border-bottom-right-radius: 10px; border-bottom-left-radius: 2px; }
    .ai-msg { background: var(--bg-input); color: var(--text-main); align-self: flex-end; border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }
    body.en-mode .ai-msg { align-self: flex-start; border-bottom-left-radius: 10px; border-bottom-right-radius: 2px; }

    .input-area { display: flex; gap: 8px; }
    .prompt-input { flex: 1; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; outline: none; font-size: 13px; }
    .prompt-input:focus { border-color: var(--accent-color); }
    .btn-send { background: var(--accent-color); color: #fff; border: none; padding: 0 16px; font-weight: 600; border-radius: 8px; cursor: pointer; }

    /* لوحة التبديل والمعاينة */
    .workspace-panel { flex: 1; display: flex; flex-direction: column; background: var(--workspace-bg); }

    .workspace-toolbar { display: flex; align-items: center; justify-content: flex-start; padding: 8px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); gap: 8px; }
    .tab-btn { background: transparent; color: var(--text-muted); border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .tab-btn:hover { color: var(--text-main); background: var(--bg-input); }
    .tab-btn.active { background: var(--accent-color); color: #fff; }

    .tab-content { flex: 1; display: none; height: 100%; width: 100%; }
    .tab-content.active { display: flex; }

    textarea { width: 100%; height: 100%; background: var(--bg-main); color: var(--text-main); border: none; padding: 16px; font-family: monospace; resize: none; outline: none; font-size: 13px; line-height: 1.6; }
    .preview-frame { width: 100%; height: 100%; border: none; background: #ffffff; }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ Jawad Builder</div>
    <div class="header-actions">
      <button class="btn-tool" id="themeToggleBtn" onclick="toggleAppTheme()">🌙 <span id="themeTxt">مسائي</span></button>
      <button class="btn-tool" id="langToggleBtn" onclick="toggleAppLang()">🌐 English</button>
      <button class="btn-download" id="dlBtn">📦 <span id="dlTxt">تنزيل ZIP</span></button>
    </div>
  </header>

  <main>
    <div class="chat-panel">
      <input type="password" id="secretKey" class="secret-input" placeholder="ضع كلمة السر (OpenRouter API) هنا...">
      
      <div class="chat-box" id="chatBox">
        <div class="msg ai-msg" id="welcomeMsg">مرحباً جواد! اكتب فكرتك هنا وسأقوم ببناء موقعك فوراً.</div>
      </div>
      
      <div class="input-area">
        <input type="text" id="userInput" class="prompt-input" placeholder="اطلب تصميم موقع...">
        <button class="btn-send" id="sendBtn">إرسال</button>
      </div>
    </div>

    <div class="workspace-panel">
      <div class="workspace-toolbar">
        <button class="tab-btn active" id="btnPreview" onclick="switchTab('preview')">👁️ <span id="prevTxt">المعاينة</span></button>
        <button class="tab-btn" id="btnCode" onclick="switchTab('code')">&lt;/&gt; <span id="codeTxt">الكود</span></button>
      </div>

      <div id="previewTab" class="tab-content active">
        <iframe id="previewFrame" class="preview-frame"></iframe>
      </div>

      <div id="codeTab" class="tab-content">
        <textarea id="codeArea" placeholder="الكود البرمجي سيظهر هنا..."></textarea>
      </div>
    </div>
  </main>

  <script src="script.js">const defaultHTML = `<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding-top: 80px; background: #0f172a; color: #fff; margin: 0; }
    h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 25px; }
    button { padding: 12px 28px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h1>Jawad Builder 🚀</h1>
  <p>التطبيق جاهز وسلس جداً! ضع كلمة السر واطلب أي موقع تريد إنشاءه.</p>
  <button onclick="alert('كل شيء يعمل بسرعة وسلاسة!')">تجربة الموقع</button>
</body>
</html>`;

document.getElementById('codeArea').value = defaultHTML;

// 1. التبديل بين الوضع الصباحي والليلي لمنصة Builder
function toggleAppTheme() {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  const themeBtn = document.getElementById('themeToggleBtn');
  const isEn = document.body.classList.contains('en-mode');

  if (isLight) {
    themeBtn.innerHTML = `☀️ ${isEn ? 'Light' : 'صباحي'}`;
  } else {
    themeBtn.innerHTML = `🌙 ${isEn ? 'Dark' : 'مسائي'}`;
  }
}

// 2. التبديل بين اللغة العربية والإنجليزي لمنصة Builder
let appLang = 'ar';
function toggleAppLang() {
  appLang = appLang === 'ar' ? 'en' : 'ar';
  const isEn = appLang === 'en';
  const html = document.documentElement;

  if (isEn) {
    html.lang = 'en';
    html.dir = 'ltr';
    document.body.classList.add('en-mode');
    
    document.getElementById('langToggleBtn').innerText = '🌐 عربي';
    document.getElementById('dlTxt').innerText = 'Download ZIP';
    document.getElementById('secretKey').placeholder = 'Enter OpenRouter API Key...';
    document.getElementById('welcomeMsg').innerText = 'Hello Jawad! Type your request here to build your website.';
    document.getElementById('userInput').placeholder = 'Ask to build a website...';
    document.getElementById('sendBtn').innerText = 'Send';
    document.getElementById('prevTxt').innerText = 'Preview';
    document.getElementById('codeTxt').innerText = 'Code';
    document.getElementById('themeTxt').innerText = document.body.classList.contains('light-mode') ? 'Light' : 'Dark';
  } else {
    html.lang = 'ar';
    html.dir = 'rtl';
    document.body.classList.remove('en-mode');

    document.getElementById('langToggleBtn').innerText = '🌐 English';
    document.getElementById('dlTxt').innerText = 'تنزيل ZIP';
    document.getElementById('secretKey').placeholder = 'ضع كلمة السر (OpenRouter API) هنا...';
    document.getElementById('welcomeMsg').innerText = 'مرحباً جواد! اكتب فكرتك هنا وسأقوم ببناء موقعك فوراً.';
    document.getElementById('userInput').placeholder = 'اطلب تصميم موقع...';
    document.getElementById('sendBtn').innerText = 'إرسال';
    document.getElementById('prevTxt').innerText = 'المعاينة';
    document.getElementById('codeTxt').innerText = 'الكود';
    document.getElementById('themeTxt').innerText = document.body.classList.contains('light-mode') ? 'صباحي' : 'مسائي';
  }
}

// تحديث المعاينة عبر srcdoc
function updatePreview() {
  const code = document.getElementById('codeArea').value;
  const frame = document.getElementById('previewFrame');
  frame.srcdoc = code;
}

document.getElementById('codeArea').addEventListener('input', updatePreview);

// دالة التنقل بين التبويبات
function switchTab(tabName) {
  const previewTab = document.getElementById('previewTab');
  const codeTab = document.getElementById('codeTab');
  const btnPreview = document.getElementById('btnPreview');
  const btnCode = document.getElementById('btnCode');

  if (tabName === 'preview') {
    previewTab.classList.add('active');
    codeTab.classList.remove('active');
    btnPreview.classList.add('active');
    btnCode.classList.remove('active');
    updatePreview();
  } else {
    codeTab.classList.add('active');
    previewTab.classList.remove('active');
    btnCode.classList.add('active');
    btnPreview.classList.remove('active');
  }
}

// توليد الكود عبر الذكاء الاصطناعي
async function generateCode() {
  const secretKey = document.getElementById('secretKey').value.trim();
  const input = document.getElementById('userInput');
  const prompt = input.value.trim();
  
  if (!prompt) return;

  if (!secretKey) {
    alert(appLang === 'en' ? 'Please enter your API Key first!' : 'يرجى إدخال كلمة السر أولاً!');
    return;
  }

  addMessage(prompt, 'user-msg');
  input.value = '';
  addMessage(appLang === 'en' ? 'Generating website code...' : 'جاري بناء وتوليد كود الموقع...', 'ai-msg');

  try {
    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + secretKey,
        'HTTP-Referer': window.location.href,
        'X-Title': 'Jawad Builder',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'google/gemini-2.5-flash',
        max_tokens: 8000,
        messages: [
          {
            role: 'system',
            content: 'You are an expert web developer. Generate a COMPLETE, FULLY WORKING single-file HTML document (including inline CSS and JavaScript). NEVER truncate or cut off the code. Ensure all HTML tags are properly closed at the end (e.g. </html>). You may use Tailwind CSS via CDN if helpful. Return ONLY the raw HTML code starting with <!DOCTYPE html> without markdown syntax or explanations.'
          },
          {
            role: 'user',
            content: prompt
          }
        ]
      })
    });

    const data = await response.json();

    if (response.ok && data.choices && data.choices[0]) {
      let generatedCode = data.choices[0].message.content;
      
      generatedCode = generatedCode.replace(/^```html/gi, '')
                                   .replace(/^```/gi, '')
                                   .replace(/```$/gi, '')
                                   .trim();

      document.getElementById('codeArea').value = generatedCode;
      updatePreview();
      switchTab('preview');
      addMessage(appLang === 'en' ? 'Website built successfully!' : 'تم بناء الموقع بنجاح!', 'ai-msg');
    } else {
      const errDetail = data.error ? data.error.message : 'Check API Key.';
      addMessage((appLang === 'en' ? 'Error: ' : 'خطأ: ') + errDetail, 'ai-msg');
    }

  } catch (err) {
    addMessage(appLang === 'en' ? 'Network error.' : 'حدث خطأ أثناء الاتصال بالشبكة.', 'ai-msg');
  }
}

document.getElementById('sendBtn').addEventListener('click', generateCode);
document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') generateCode();
});

function addMessage(text, className) {
  const box = document.getElementById('chatBox');
  const msg = document.createElement('div');
  msg.className = 'msg ' + className;
  msg.innerText = text;
  box.appendChild(msg);
  box.scrollTop = box.scrollHeight;
}

document.getElementById('dlBtn').addEventListener('click', function() {
  const zip = new JSZip();
  const code = document.getElementById('codeArea').value;
  zip.file("index.html", code);
  zip.generateAsync({type:"blob"}).then(function(content) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = "jawad-project.zip";
    a.click();
  });
});

updatePreview();</script>
</body>
</html>
