<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jawad Builder 🚀</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-panel: #151c28;
      --bg-input: #1e2738;
      --border-color: #2a364f;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body.light-mode {
      --bg-main: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-input: #e2e8f0;
      --border-color: #cbd5e1;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; transition: background 0.2s, color 0.2s; }
    
    html, body { 
      height: 100%; 
      height: 100svh; /* لضبط الارتفاع الدقيق في متصفحات الجوال */
      width: 100%; 
      background: var(--bg-main); 
      color: var(--text-main); 
      overflow: hidden; 
    }

    body { 
      display: flex; 
      flex-direction: column; 
    }

    /* الهيدر العلوي المحسن بالكامل */
    header { 
      display: flex; 
      flex-direction: column;
      padding: 12px;
      background: var(--bg-panel); 
      border-bottom: 1px solid var(--border-color); 
      gap: 10px; 
      z-index: 99;
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      direction: ltr; /* توحيد الهيكل الداخلي للهيدر لمنع تداخل الشعار والأزرار */
    }

    .logo { 
      font-size: 1rem; 
      font-weight: 700; 
      color: var(--accent-color); 
      display: flex; 
      align-items: center; 
      gap: 4px; 
      white-space: nowrap; 
    }

    .header-actions { 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    
    .btn-tool { 
      background: var(--bg-input); 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      padding: 6px 8px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 11px; 
      font-weight: 600; 
      white-space: nowrap; 
    }

    .btn-download { 
      background: var(--accent-color); 
      color: #fff; 
      border: none; 
      padding: 6px 10px; 
      font-weight: 600; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 11px; 
      white-space: nowrap; 
    }

    /* شريط أزرار التنقل */
    .view-switcher { 
      display: flex; 
      background: var(--bg-input); 
      padding: 3px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      gap: 4px; 
      width: 100%; 
    }

    .switch-btn { 
      flex: 1; 
      background: transparent; 
      color: var(--text-muted); 
      border: none; 
      padding: 8px 4px; 
      border-radius: 6px; 
      font-size: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      text-align: center; 
      white-space: nowrap; 
    }

    .switch-btn.active { 
      background: var(--accent-color); 
      color: #fff; 
    }

    /* المنطقة الرئيسية للعرض */
    main { 
      flex: 1; 
      position: relative; 
      width: 100%; 
      overflow: hidden; 
    }

    /* لوحات العرض */
    .view-panel { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      display: none; 
      flex-direction: column; 
      background: var(--bg-main); 
    }

    .view-panel.active { 
      display: flex; 
    }

    /* لوحة الشات */
    .chat-panel { 
      padding: 12px; 
      gap: 10px; 
      height: 100%; 
      background: var(--bg-panel); 
    }

    .secret-input { 
      padding: 10px; 
      background: var(--bg-input); 
      border: 1px solid var(--border-color); 
      color: var(--text-main); 
      border-radius: 8px; 
      outline: none; 
      font-size: 12px; 
      flex-shrink: 0;
    } 
    
    .chat-box { 
      flex: 1; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      padding-bottom: 5px;
    }

    .msg { 
      padding: 10px 14px; 
      border-radius: 10px; 
      font-size: 13px; 
      max-width: 88%; 
      word-break: break-word; 
      line-height: 1.4; 
    }

    .user-msg { 
      background: var(--accent-color); 
      color: #fff; 
      align-self: flex-start; 
    }

    body.en-mode .user-msg { 
      align-self: flex-end; 
    }

    .ai-msg { 
      background: var(--bg-input); 
      color: var(--text-main); 
      align-self: flex-end; 
      border: 1px solid var(--border-color); 
    }

    body.en-mode .ai-msg { 
      align-self: flex-start; 
    }

    /* حقل الإدخال السفلي المحمي من أشرطة المتصفح والتطبيق */
    .input-area { 
      display: flex; 
      gap: 8px; 
      padding-top: 4px;
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    .prompt-input { 
      flex: 1; 
      padding: 12px; 
      background: var(--bg-input); 
      border: 1px solid var(--border-color); 
      color: var(--text-main); 
      border-radius: 8px; 
      outline: none; 
      font-size: 13px; 
    }

    .btn-send { 
      background: var(--accent-color); 
      color: #fff; 
      border: none; 
      padding: 0 16px; 
      font-weight: 600; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 13px; 
      white-space: nowrap;
    }

    /* لوحة المعاينة والكود */
    .preview-frame { 
      width: 100%; 
      height: 100%; 
      border: none; 
      background: #ffffff; 
    }

    textarea { 
      width: 100%; 
      height: 100%; 
      background: var(--bg-main); 
      color: var(--text-main); 
      border: none; 
      padding: 14px; 
      font-family: monospace; 
      resize: none; 
      outline: none; 
      font-size: 12px; 
      line-height: 1.5; 
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="header-actions">
        <button class="btn-download" id="dlBtn">📦 <span id="dlTxt">ZIP</span></button>
        <button class="btn-tool" id="langToggleBtn" onclick="toggleAppLang()">🌐 EN</button>
        <button class="btn-tool" id="themeToggleBtn" onclick="toggleAppTheme()">🌙 <span id="themeTxt">مسائي</span></button>
      </div>
      <div class="logo">⚡ Jawad Builder</div>
    </div>

    <div class="view-switcher">
      <button class="switch-btn active" id="btnChat" onclick="switchView('chat')">💬 <span id="chatTxt">الشات</span></button>
      <button class="switch-btn" id="btnPreview" onclick="switchView('preview')">👁️ <span id="prevTxt">المعاينة</span></button>
      <button class="switch-btn" id="btnCode" onclick="switchView('code')">&lt;/&gt; <span id="codeTxt">الكود</span></button>
    </div>
  </header>

  <main>
    <div id="chatView" class="view-panel chat-panel active">
      <input type="password" id="secretKey" class="secret-input" placeholder="ضع كلمة السر (OpenRouter API) هنا...">
      
      <div class="chat-box" id="chatBox">
        <div class="msg ai-msg" id="welcomeMsg">مرحباً جواد! اكتب فكرتك هنا وسأقوم ببناء موقعك فوراً.</div>
      </div>
      
      <div class="input-area">
        <input type="text" id="userInput" class="prompt-input" placeholder="اطلب تصميم موقع...">
        <button class="btn-send" id="sendBtn">إرسال</button>
      </div>
    </div>

    <div id="previewView" class="view-panel">
      <iframe id="previewFrame" class="preview-frame"></iframe>
    </div>

    <div id="codeView" class="view-panel">
      <textarea id="codeArea" placeholder="الكود البرمجي سيظهر هنا..."></textarea>
    </div>
  </main>

  <script>
    const defaultHTML = `<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding-top: 80px; background: #0f172a; color: #fff; margin: 0; }
    h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 25px; }
    button { padding: 12px 28px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Jawad Builder 🚀</h1>
  <p>التطبيق جاهز وسلس جداً! ضع كلمة السر واطلب أي موقع تريد إنشاءه.</p>
  <button onclick="alert('كل شيء يعمل بسرعة وسلاسة!')">تجربة الموقع</button>
</body>
</html>`;

    document.getElementById('codeArea').value = defaultHTML;

    function switchView(viewName) {
      document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.switch-btn').forEach(el => el.classList.remove('active'));

      if (viewName === 'chat') {
        document.getElementById('chatView').classList.add('active');
        document.getElementById('btnChat').classList.add('active');
      } else if (viewName === 'preview') {
        document.getElementById('previewView').classList.add('active');
        document.getElementById('btnPreview').classList.add('active');
        updatePreview();
      } else if (viewName === 'code') {
        document.getElementById('codeView').classList.add('active');
        document.getElementById('btnCode').classList.add('active');
      }
    }

    function toggleAppTheme() {
      document.body.classList.toggle('light-mode');
      updateThemeButtonText();
    }

    function updateThemeButtonText() {
      const isLight = document.body.classList.contains('light-mode');
      const isEn = appLang === 'en';
      const icon = isLight ? '☀️' : '🌙';
      let label = isEn ? (isLight ? 'Light' : 'Dark') : (isLight ? 'صباحي' : 'مسائي');
      document.getElementById('themeToggleBtn').innerHTML = `${icon} <span id="themeTxt">${label}</span>`;
    }

    let appLang = 'ar';
    function toggleAppLang() {
      appLang = appLang === 'ar' ? 'en' : 'ar';
      const isEn = appLang === 'en';
      document.documentElement.lang = isEn ? 'en' : 'ar';
      document.documentElement.dir = isEn ? 'ltr' : 'rtl';
      document.body.classList.toggle('en-mode', isEn);

      document.getElementById('langToggleBtn').innerText = isEn ? '🌐 AR' : '🌐 EN';
      document.getElementById('dlTxt').innerText = 'ZIP';
      document.getElementById('chatTxt').innerText = isEn ? 'Chat' : 'الشات';
      document.getElementById('prevTxt').innerText = isEn ? 'Preview' : 'المعاينة';
      document.getElementById('codeTxt').innerText = isEn ? 'Code' : 'الكود';
      document.getElementById('secretKey').placeholder = isEn ? 'Enter API Key...' : 'ضع كلمة السر (OpenRouter API) هنا...';
      document.getElementById('welcomeMsg').innerText = isEn ? 'Hello Jawad! Type your idea here.' : 'مرحباً جواد! اكتب فكرتك هنا وسأقوم ببناء موقعك فوراً.';
      document.getElementById('userInput').placeholder = isEn ? 'Ask to build a website...' : 'اطلب تصميم موقع...';
      document.getElementById('sendBtn').innerText = isEn ? 'Send' : 'إرسال';

      updateThemeButtonText();
    }

    function updatePreview() {
      const code = document.getElementById('codeArea').value;
      document.getElementById('previewFrame').srcdoc = code;
    }

    document.getElementById('codeArea').addEventListener('input', updatePreview);

    async function generateCode() {
      const secretKey = document.getElementById('secretKey').value.trim();
      const input = document.getElementById('userInput');
      const prompt = input.value.trim();
      
      if (!prompt) return;
      if (!secretKey) {
        alert(appLang === 'en' ? 'Please enter your API Key first!' : 'يرجى إدخال كلمة السر أولاً!');
        return;
      }

      addMessage(prompt, 'user-msg');
      input.value = '';
      addMessage(appLang === 'en' ? 'Generating website code...' : 'جاري بناء وتوليد كود الموقع...', 'ai-msg');

      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + secretKey,
            'HTTP-Referer': window.location.href,
            'X-Title': 'Jawad Builder',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'google/gemini-2.5-flash',
            max_tokens: 8000,
            messages: [
              {
                role: 'system',
                content: 'You are an expert web developer. Generate a COMPLETE, FULLY WORKING single-file HTML document (including inline CSS and JavaScript). NEVER truncate or cut off the code. Ensure all HTML tags are properly closed at the end (e.g. </html>). You may use Tailwind CSS via CDN if helpful. Return ONLY raw HTML code starting with <!DOCTYPE html> without markdown blocks.'
              },
              { role: 'user', content: prompt }
            ]
          })
        });

        const data = await response.json();

        if (response.ok && data.choices && data.choices[0]) {
          let generatedCode = data.choices[0].message.content;
          generatedCode = generatedCode.replace(/^```html/gi, '').replace(/^```/gi, '').replace(/```$/gi, '').trim();

          document.getElementById('codeArea').value = generatedCode;
          updatePreview();
          switchView('preview');
          addMessage(appLang === 'en' ? 'Website built successfully!' : 'تم بناء الموقع بنجاح!', 'ai-msg');
        } else {
          const errDetail = data.error ? data.error.message : 'Check API Key.';
          addMessage((appLang === 'en' ? 'Error: ' : 'خطأ: ') + errDetail, 'ai-msg');
        }
      } catch (err) {
        addMessage(appLang === 'en' ? 'Network error.' : 'حدث خطأ أثناء الاتصال بالشبكة.', 'ai-msg');
      }
    }

    document.getElementById('sendBtn').addEventListener('click', generateCode);
    document.getElementById('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') generateCode(); });

    function addMessage(text, className) {
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = 'msg ' + className;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('dlBtn').addEventListener('click', function() {
      const zip = new JSZip();
      zip.file("index.html", document.getElementById('codeArea').value);
      zip.generateAsync({type:"blob"}).then(content => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "jawad-project.zip";
        a.click();
      });
    });

    updatePreview();
  </script>
</body>
</html>
