<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jawad Builder 🚀</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-panel: #151c28;
      --bg-input: #1e2738;
      --border-color: #2a364f;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body.light-mode {
      --bg-main: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-input: #e2e8f0;
      --border-color: #cbd5e1;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, sans-serif; 
      transition: background 0.2s, color 0.2s; 
      -webkit-user-select: text !important;
      user-select: text !important;
    }
    
    html, body { 
      width: 100%; 
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-main); 
      color: var(--text-main); 
      overflow: hidden; 
    }

    #app-container {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header { 
      display: flex; 
      flex-direction: column;
      padding: 10px 12px;
      background: var(--bg-panel); 
      border-bottom: 1px solid var(--border-color); 
      gap: 8px; 
      z-index: 99;
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      direction: ltr;
    }

    .logo { 
      font-size: 1rem; 
      font-weight: 700; 
      color: var(--accent-color); 
      display: flex; 
      align-items: center; 
      gap: 4px; 
      white-space: nowrap; 
    }

    .header-actions { 
      display: flex; 
      align-items: center; 
      gap: 4px; 
    } 
    
    /* توحيد مقاسات جميع الأزرار العلوية بالمليمتر */
    .btn-tool, .btn-download { 
      background: var(--bg-input); 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      padding: 6px 2px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 11px; 
      font-weight: 600; 
      white-space: nowrap; 
      width: 68px; 
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-download { 
      background: var(--accent-color); 
      color: #fff; 
      border: none; 
    }

    .view-switcher { 
      display: flex; 
      background: var(--bg-input); 
      padding: 3px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      gap: 4px; 
      width: 100%; 
    }

    .switch-btn { 
      flex: 1; 
      background: transparent; 
      color: var(--text-muted); 
      border: none; 
      padding: 7px 4px; 
      border-radius: 6px; 
      font-size: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      text-align: center; 
      white-space: nowrap; 
    }

    .switch-btn.active { 
      background: var(--accent-color); 
      color: #fff; 
    }

    main { 
      flex: 1; 
      position: relative; 
      width: 100%; 
      overflow: hidden; 
    }

    .view-panel { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      display: none; 
      flex-direction: column; 
      background: var(--bg-main); 
    }

    .view-panel.active { 
      display: flex; 
    }

    .chat-panel { 
      padding: 10px 12px; 
      gap: 8px; 
      height: 100%; 
      background: var(--bg-panel); 
      display: flex;
      flex-direction: column;
    }

    .secret-container {
      display: flex;
      gap: 6px;
      width: 100%;
      flex-shrink: 0;
    }

    .secret-input { 
      flex: 1;
      padding: 9px; 
      background: var(--bg-input); 
      border: 1px solid var(--border-color); 
      color: var(--text-main); 
      border-radius: 8px; 
      outline: none; 
      font-size: 12px; 
      -webkit-text-security: disc; 
    } 

    .chat-box { 
      flex: 1; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      padding-bottom: 5px;
    }

    .msg { 
      padding: 9px 12px; 
      border-radius: 10px; 
      font-size: 13px; 
      max-width: 88%; 
      word-break: break-word; 
      line-height: 1.4; 
    }

    .user-msg { 
      background: var(--accent-color); 
      color: #fff; 
      align-self: flex-start; 
    }

    body.en-mode .user-msg { 
      align-self: flex-end; 
    }

    .ai-msg { 
      background: var(--bg-input); 
      color: var(--text-main); 
      align-self: flex-end; 
      border: 1px solid var(--border-color); 
    }

    body.en-mode .ai-msg { 
      align-self: flex-start; 
    }

    .input-area { 
      display: flex; 
      gap: 8px; 
      padding-top: 4px;
      padding-bottom: 6px;
      flex-shrink: 0;
    }

    .prompt-input { 
      flex: 1; 
      padding: 10px 12px; 
      background: var(--bg-input); 
      border: 1px solid var(--border-color); 
      color: var(--text-main); 
      border-radius: 8px; 
      outline: none; 
      font-size: 13px; 
    }

    .btn-send { 
      background: var(--accent-color); 
      color: #fff; 
      border: none; 
      padding: 0 16px; 
      font-weight: 600; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 13px; 
      white-space: nowrap;
    }

    .preview-frame { 
      width: 100%; 
      height: 100%; 
      border: none; 
      background: #ffffff; 
    }

    textarea { 
      width: 100%; 
      height: 100%; 
      background: var(--bg-main); 
      color: var(--text-main); 
      border: none; 
      padding: 12px; 
      font-family: monospace; 
      resize: none; 
      outline: none; 
      font-size: 12px; 
      line-height: 1.5; 
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <div class="top-bar">
        <div class="header-actions">
          <button class="btn-download" id="dlBtn">📦 <span id="dlTxt">ZIP</span></button>
          <button class="btn-tool" id="langToggleBtn" onclick="toggleAppLang()">🌐 EN</button>
          <button class="btn-tool" id="themeToggleBtn" onclick="toggleAppTheme()"></button>
        </div>
        <div class="logo">⚡ Jawad Builder</div>
      </div>

      <div class="view-switcher">
        <button class="switch-btn active" id="btnChat" onclick="switchView('chat')">💬 <span id="chatTxt">الشات</span></button>
        <button class="switch-btn" id="btnPreview" onclick="switchView('preview')">👁️ <span id="prevTxt">المعاينة</span></button>
        <button class="switch-btn" id="btnCode" onclick="switchView('code')">&lt;/&gt; <span id="codeTxt">الكود</span></button>
      </div>
    </header>

    <main>
      <div id="chatView" class="view-panel chat-panel active">
        <div class="secret-container">
          <input type="text" id="secretKey" class="secret-input" placeholder="ضع مفتاح كلمة السر هنا..." autocomplete="off">
        </div>
        
        <div class="chat-box" id="chatBox">
          <div class="msg ai-msg" id="welcomeMsg">مرحباً جواد! اكتب فكرتك هنا وسأقوم ببناء موقعك فوراً عبر Jawad Builder.</div>
        </div>
        
        <div class="input-area">
          <input type="text" id="userInput" class="prompt-input" placeholder="اطلب تصميم موقع...">
          <button class="btn-send" id="sendBtn">إرسال</button>
        </div>
      </div>

      <div id="previewView" class="view-panel">
        <iframe id="previewFrame" class="preview-frame"></iframe>
      </div>

      <div id="codeView" class="view-panel">
        <textarea id="codeArea" placeholder="الكود البرمجي سيظهر هنا..."></textarea>
      </div>
    </main>
  </div>

  <script>
    let appLang = 'ar';

    function setRealHeight() {
      const vh = window.innerHeight;
      document.getElementById('app-container').style.height = `${vh}px`;
    }
    window.addEventListener('resize', setRealHeight);
    window.addEventListener('orientationchange', setRealHeight);
    setRealHeight();

    const defaultHTML = `<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding-top: 80px; background: #0f172a; color: #fff; margin: 0; }
    h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 25px; }
    button { padding: 12px 28px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Jawad Builder 🚀</h1>
  <p>التطبيق يعمل بربط Jawad Builder المباشر مع 1500 طلب يومياً!</p>
  <button onclick="alert('سريع ومجاني بدون حدود معقدة!')">تجربة الموقع</button>
</body>
</html>`;

    document.getElementById('codeArea').value = defaultHTML;

    function switchView(viewName) {
      document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.switch-btn').forEach(el => el.classList.remove('active'));

      if (viewName === 'chat') {
        document.getElementById('chatView').classList.add('active');
        document.getElementById('btnChat').classList.add('active');
      } else if (viewName === 'preview') {
        document.getElementById('previewView').classList.add('active');
        document.getElementById('btnPreview').classList.add('active');
        updatePreview();
      } else if (viewName === 'code') {
        document.getElementById('codeView').classList.add('active');
        document.getElementById('btnCode').classList.add('active');
      }
    }

    function toggleAppTheme() {
      document.body.classList.toggle('light-mode');
      updateThemeButtonText();
    }

    function updateThemeButtonText() {
      const isLight = document.body.classList.contains('light-mode');
      const isEn = appLang === 'en';
      
      const icon = isLight ? '🌙' : '☀️';
      let label = isEn ? (isLight ? 'Dark' : 'Light') : (isLight ? 'مسائي' : 'صباحي');
      
      document.getElementById('themeToggleBtn').innerHTML = `${icon} <span id="themeTxt">${label}</span>`;
    }

    function updateLanguageUI() {
      const isEn = appLang === 'en';
      document.documentElement.lang = isEn ? 'en' : 'ar';
      document.documentElement.dir = isEn ? 'ltr' : 'rtl';
      document.body.classList.toggle('en-mode', isEn);

      document.getElementById('langToggleBtn').innerText = isEn ? '🌐 AR' : '🌐 EN';
      document.getElementById('dlTxt').innerText = 'ZIP';
      document.getElementById('chatTxt').innerText = isEn ? 'Chat' : 'الشات';
      document.getElementById('prevTxt').innerText = isEn ? 'Preview' : 'المعاينة';
      document.getElementById('codeTxt').innerText = isEn ? 'Code' : 'الكود';
      document.getElementById('secretKey').placeholder = isEn ? 'Enter API Key...' : 'ضع مفتاح كلمة السر هنا...';
      document.getElementById('welcomeMsg').innerText = isEn ? 'Hello Jawad! Type your idea here.' : 'مرحباً جواد! اكتب فكرتك هنا وسأقوم ببناء موقعك فوراً عبر Jawad Builder.';
      document.getElementById('userInput').placeholder = isEn ? 'Ask to build a website...' : 'اطلب تصميم موقع...';
      document.getElementById('sendBtn').innerText = isEn ? 'Send' : 'إرسال';

      updateThemeButtonText();
    }

    function toggleAppLang() {
      appLang = appLang === 'ar' ? 'en' : 'ar';
      updateLanguageUI();
    }

    function updatePreview() {
      const code = document.getElementById('codeArea').value;
      document.getElementById('previewFrame').srcdoc = code;
    }

    document.getElementById('codeArea').addEventListener('input', updatePreview);

    async function generateCode() {
      const secretKey = document.getElementById('secretKey').value.trim();
      const input = document.getElementById('userInput');
      const prompt = input.value.trim();
      
      if (!prompt) return;
      if (!secretKey) {
        alert(appLang === 'en' ? 'Please enter your API Key first!' : 'يرجى إدخال مفتاح كلمة السر أولاً!');
        return;
      }

      addMessage(prompt, 'user-msg');
      input.value = '';
      addMessage(appLang === 'en' ? 'Generating website code...' : 'جاري توليد كود الموقع...', 'ai-msg');

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${secretKey}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `You are an expert web developer. Generate a COMPLETE, FULLY WORKING single-file HTML document (including inline CSS and JavaScript) for this request: "${prompt}". NEVER truncate or cut off the code. Ensure all HTML tags are properly closed. Return ONLY raw HTML code starting with <!DOCTYPE html> without markdown blocks.`
              }]
            }]
          })
        });

        const data = await response.json();

        if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          let generatedCode = data.candidates[0].content.parts[0].text;
          generatedCode = generatedCode.replace(/^```html/gi, '').replace(/^```/gi, '').replace(/```$/gi, '').trim();

          document.getElementById('codeArea').value = generatedCode;
          updatePreview();
          switchView('preview');
          addMessage(appLang === 'en' ? 'Website built successfully!' : 'تم بناء الموقع بنجاح!', 'ai-msg');
        } else {
          const errDetail = data.error ? data.error.message : 'Check API Key.';
          addMessage((appLang === 'en' ? 'Error: ' : 'خطأ: ') + errDetail, 'ai-msg');
        }
      } catch (err) {
        addMessage(appLang === 'en' ? 'Network error.' : 'حدث خطأ أثناء الاتصال بالشبكة.', 'ai-msg');
      }
    }

    document.getElementById('sendBtn').addEventListener('click', generateCode);
    document.getElementById('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') generateCode(); });

    function addMessage(text, className) {
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = 'msg ' + className;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('dlBtn').addEventListener('click', function() {
      const zip = new JSZip();
      zip.file("index.html", document.getElementById('codeArea').value);
      zip.generateAsync({type:"blob"}).then(content => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "jawad-project.zip";
        a.click();
      });
    });

    updateLanguageUI();
    updatePreview();
  </script>
</body>
</html>
